name: 官网与双语开发文档
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # 官网不需要下载 Electron 或启动后端。
      - run: npm ci --ignore-scripts
      # 覆盖真实组件构建、逐项关联和现有官网演示的全部测试。
      - run: node --test tests/docs*.test.mjs
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-docs-preview
          path: dist/site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        with:
          path: dist/site/
  deploy:
    # 用户确认暂不启用，管理员开启 Pages 和变量后才允许发布。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: 发布官网
        id: deployment
        uses: actions/deploy-pages@v4
