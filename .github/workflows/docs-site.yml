name: 官网与双语开发文档
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: '发布所选分支的官网到 GitHub Pages'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # 官网不需要下载 Electron 或启动后端。
      - run: npm ci --ignore-scripts
      # 覆盖原位界面、逐项关联、发布边界和既有官网演示。
      - run: node --test tests/docs*.test.mjs
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-docs-preview
          path: dist/site/
      - uses: actions/upload-pages-artifact@v4
        # 手动发布必须明确勾选；自动发布仅限主线且需要单独开启变量。
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true')
        with:
          path: dist/site/
  deploy:
    # 官网需求分支可经明确手动操作发布，PR 验证永远不发布，也不自动合并代码。
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: 发布官网
        id: deployment
        uses: actions/deploy-pages@v4
